<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historico de Versoes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Historico de Versoes</h1>
    <p>Pagina usada para praticar commits, tags e publicacao. Cada versao abaixo corresponde a uma tag no Git.</p>
    <table>
      <thead>
        <tr><th>Tag</th><th>Alteracao</th></tr>
      </thead>
      <tbody id="versoes"></tbody>
    </table>
    <button id="alternar">Mostrar apenas a ultima versao</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
