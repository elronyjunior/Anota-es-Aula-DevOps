name: CI - API Registro de Deploys

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unitarios:
    name: Testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:unit

  integracao:
    name: Testes de integracao
    runs-on: ubuntu-latest
    needs: unitarios
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:integration

  performance:
    name: Teste de carga (k6)
    runs-on: ubuntu-latest
    needs: integracao
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: grafana/setup-k6-action@v1
      - run: npm run test:performance
