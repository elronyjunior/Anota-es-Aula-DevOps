name: CI/CD - Site Estatico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  build:
    name: Build e verificacao de tamanho
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check:size
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy no GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      url: ${{ steps.publicacao.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5

  verificacao:
    name: Verificacao pos-deploy
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Confere se o site publicado responde com HTTP 200
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          for tentativa in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Tentativa $tentativa: $URL retornou $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          exit 1
