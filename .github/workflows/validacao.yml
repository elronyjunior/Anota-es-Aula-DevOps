name: Validacao do Repositorio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentacao:
    name: Documentacao (${{ matrix.verificacao }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        verificacao: [estrutura, links, formato, seguranca]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validar_docs.py ${{ matrix.verificacao }}

  projetos:
    name: Testes do projeto ${{ matrix.projeto }}
    runs-on: ubuntu-latest
    needs: documentacao
    strategy:
      fail-fast: false
      matrix:
        projeto: [api-registro-deploys, pipeline-site-estatico]
    defaults:
      run:
        working-directory: projetos/${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  pacote:
    name: Empacotar documentacao
    runs-on: ubuntu-latest
    needs: projetos
    steps:
      - uses: actions/checkout@v7
      - name: Gera pacote com README, aulas e projetos
        run: tar --exclude=node_modules --exclude=dist -czf anotacoes-devops.tar.gz README.md Aula* projetos
      - uses: actions/upload-artifact@v7
        with:
          name: anotacoes-devops
          path: anotacoes-devops.tar.gz
          retention-days: 7
